<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Weather Dashboard</h1>
       
        <form id="weatherform">
               <input 
                    type="text"
                    id="cityinput"
                    placeholder="Enter the city"
                    >
                <button type="submit">
                    Search
                </button>
        </form>
    <h2 id="cityname"></h2>
    <p id="temperature"></p>
    <p id="humidity"></p>
    <p id="description"></p>
    <p id="loading"></p>
    <p id="error"></p>
    <img id="weathericon">
    <p id="wind"></p>

    <h2>5 day forecast</h2>
    <div id="forecast"></div>





    <script src="script.js"></script>
</body>
</html>
